  sections:
    Education:
      - institution: Imperial College London
        location: London, UK
        area: Mathematics
        studyType: PhD in Mathematics
        start_date: "2024-10"
        highlights:
          - "Research area: mixed finite element methods and preconditioners in numerical linear algebra, applied to ocean modelling. Supervisor: Prof. Colin Cotter."
          - President's PhD Scholarship; aligned with the EPSRC CDT in Mathematics for our Future Climate.
          - Expected completion in 2028.

      - institution: Imperial College London
        location: London, UK
        area: Mathematics
        studyType: MSci in Mathematics, First Class Honours (85.7%)
        start_date: "2020-10"
        end_date: "2024-06"
        highlights:
          - Dean's List in all four years (top 10% of the cohort each year).
          - "Year marks: 83.5%, 82.5%, 87.9% and 85.3% (Years 1 to 4)."
          - "Computational and applied modules: Finite Elements (91%), Computational Linear Algebra (88%), Computational PDEs (78%), Fluid Dynamics 1 (90%) and 2 (80%), Classical Dynamics (100%), Optimisation (80%)."
          - "Probability and statistics modules: Stochastic Calculus and Applications to Nonlinear Filtering (95%), Introduction to SDEs and Diffusion Processes (92%), Stochastic Simulation (88%), Statistical Learning (79%)."

    Experience:
      - company: Department of Mathematics, Imperial College London
        position: "PhD research: robust finite element solvers for ocean models"
        location: London, UK
        start_date: "2024-10"
        highlights:
          - Designing preconditioners for implicit time stepping in ocean and atmosphere models, where every time step requires the solution of a large, ill-conditioned linear system and anisotropic meshes on thin domains defeat standard point smoothers.
          - "Developed a patch-wise preconditioner for mixed Poisson-type systems: a shift eliminates the pressure, leaving a grad-div Helmholtz-type problem solved by multigrid with additive Schwarz line smoothers."
          - Extended the method to the fully nonlinear incompressible Boussinesq equations on a vertical slice, using a shifted auxiliary operator and multigrid with vertical vertex-patch line smoothers; the shift is set by a bound derived from the system linearised about a state of rest.
          - Iteration counts are robust to aspect ratio and mesh spacing, with shorter solve times than standard methods; validated on the Skamarock–Klemp gravity-wave test case in parallel MPI runs on an HPC cluster.
          - "Implemented in Firedrake, PETSc and Irksome; contributed to Firedrake's additive Schwarz patch preconditioners (PR #5211). Now extending the solver to the Lagrangian-averaged Boussinesq (alpha) model and to three dimensions."

      - company: Department of Mathematics, Imperial College London
        position: Graduate Teaching Assistant
        location: London, UK
        start_date: "2024"
        end_date: "2026"
        summary: Year 1 Calculus and Applications, Introduction to Applied Mathematics; Year 2 Multivariable Calculus, Linear Algebra and Numerical Analysis.
        highlights:
          - Marked mid-term examinations and coursework, second-marked final examinations and invigilated final exams.

      - company: Imperial College London
        position: MSci research project
        location: London, UK
        start_date: "2023-10"
        end_date: "2024-06"
        summary: "*Time-parallel solution of optimal control problems for the wave equation.* Supervisor: Prof. Colin Cotter."
        highlights:
          - Finite element formulation of the optimal control problem for the wave equation, solved with ParaDiag, a diagonalisation-based parallel-in-time method.

      - company: TUM PREP, Technical University of Munich
        position: Visiting research student
        location: Munich, Germany
        start_date: "2023-07"
        end_date: "2023-09"
        summary: "*Matrix-free iterative solver in thermo-acoustic stability analysis.* Supervisors: Prof. Wolfgang Polifke and Philipp Brokof, Mechanical Engineering."
        highlights:
          - Implemented matrix-free versions of a Newton solver and an eigenvalue solver.
          - Analysed the influence of condition numbers on the performance of GMRES for heat equations and the nonlinear Navier–Stokes equations in thermoacoustics.
          - Presented the results in a twenty-minute talk to the research group.

      - company: Imperial College London
        position: Undergraduate research (UROP)
        location: London, UK
        start_date: "2022-06"
        end_date: "2022-09"
        summary: "*Conservative bounded discontinuous Galerkin transport for atmospheric flows.* Supervisor: Prof. Colin Cotter."
        highlights:
          - Built and simulated transport equations with compressible flow in Firedrake.
          - Implemented a hierarchical flux limiter that keeps the advected solutions bounded.

      - company: Imperial College London
        position: Second-year group project
        location: London, UK
        start_date: "2022-05"
        end_date: "2022-06"
        summary: "*Homogenisation.* Supervisor: Dr Arianna Giunti."
        highlights:
          - Worked in a group of six on a report on homogenisation theory for PDE problems, including boundary layers and porous media; wrote the section on multidimensional periodic homogenisation and presented the results to peers and tutors.

      - company: Civil Engineering, Tianjin University
        position: Undergraduate research
        location: Tianjin, China
        start_date: "2021-07"
        end_date: "2022-03"
        summary: "Two projects in offshore geotechnics. Supervisor: Prof. Sa Li."
        highlights:
          - Implemented support vector regression and particle swarm optimisation in MATLAB to model the mechanical behaviour of carbonate gravel.
          - Contributed Monte Carlo simulations of the maximum inclination angle of a large tubular caisson.
          - The collaboration led to two co-authored journal papers.

      - company: Private tuition
        position: Part-time A-level tutor
        start_date: "2020"
        end_date: "2023"
        summary: Taught A-level Mathematics and Physics weekly and supervised an EPQ project on the brachistochrone problem; the student went on to study Mechanical Engineering (MEng) at the University of Bristol.

