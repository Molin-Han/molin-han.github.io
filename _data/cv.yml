cv:
  name: Molin Han
  label: PhD student in computational mathematics
  email: molin.han20@imperial.ac.uk
  website: https://molin-han.github.io
  summary: Third-year PhD student in computational mathematics at Imperial College London, developing finite element discretisations and robust iterative solvers for geophysical fluid dynamics, implemented as parallel code in Firedrake and PETSc. Research interests include finite element methods, fluid dynamics, numerical linear algebra, high-performance computing, geometric mechanics and geotechnical engineering.

